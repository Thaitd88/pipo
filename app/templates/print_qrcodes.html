<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Thẻ QR Bàn 9x10cm - PiPo Garden</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }

    /* Kích thước in chuẩn xưởng in: Ngang 9cm (90mm) x Cao 10cm (100mm) */
    .qr-card-9x10 {
      width: 90mm;
      height: 100mm;
      max-width: 90mm;
      max-height: 100mm;
      box-sizing: border-box;
      padding: 3mm 4mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 1.5px dashed #475569;
      border-radius: 12px;
      background: #ffffff;
      page-break-inside: avoid;
      break-inside: avoid;
      overflow: hidden;
      position: relative;
    }

    /* Định dạng in chuẩn khổ A4: 2 cột 90mm đặt vừa vặn 210mm với lề an toàn chống mất viền */
    @page {
      size: A4 portrait;
      margin: 6mm 4mm;
    }

    @media print {
      html, body {
        background-color: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print {
        display: none !important;
      }
      main {
        max-width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        display: block !important;
      }
      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 90mm) !important;
        column-gap: 4mm !important;
        row-gap: 6mm !important;
        justify-content: center !important;
        align-content: start !important;
        padding: 0 !important;
        margin: 0 auto !important;
        width: 100% !important;
      }
      .qr-card-9x10 {
        width: 90mm !important;
        height: 100mm !important;
        box-sizing: border-box !important;
        box-shadow: none !important;
        border: 1.5px dashed #334155 !important;
        border-radius: 10px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: visible !important;
        margin: 0 !important;
      }
    }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen flex flex-col">

  <!-- Thanh công cụ điều khiển (Chỉ hiện trên màn hình, ẩn khi in) -->
  <header class="no-print bg-white rounded-2xl border border-stone-200 shadow-sm p-4 mb-6 max-w-5xl mx-auto w-full sticky top-3 z-50">
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="/static/logo.png" alt="PiPo Garden" class="w-11 h-11 rounded-full object-contain bg-emerald-50 p-1 border border-emerald-200">
        <div>
          <h1 class="text-base font-black text-stone-900 flex items-center gap-2">
            <span>Thẻ QR Bàn Song Ngữ 9cm x 10cm</span>
            <span id="totalBadge" class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold">31 bàn</span>
          </h1>
          <p class="text-xs text-stone-500 mt-0.5">Mã QR to tối đa, Wi-Fi bôi đậm rõ ràng, song ngữ Anh - Việt, có thương hiệu Restaurant • Cafe • Pickleball.</p>
          <p class="text-[11px] text-emerald-800 font-semibold mt-1 flex items-center gap-1.5"><i class="fa-solid fa-circle-check text-emerald-600"></i><span>Khổ A4 vừa vặn 2 cột, lề an toàn chống mất viền đứt khi xuất PDF / In Decal mica.</span></p>
        </div>
      </div>

      <!-- Nút thao tác -->
      <div class="flex flex-wrap items-center gap-2">
        <a href="/api/tables/export-all-zip" download class="px-3.5 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-xs transition flex items-center gap-1.5" title="Tải về file ZIP chứa toàn bộ ảnh QR bàn">
          <i class="fa-solid fa-file-zipper"></i>
          <span>Tải ZIP Ảnh QR</span>
        </a>

        <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-xs shadow transition flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i>
          <span>In Toàn Bộ (Ctrl+P / PDF)</span>
        </button>

        <a href="/pos" class="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs transition flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Về POS</span>
        </a>
      </div>
    </div>

    <!-- Thanh lọc theo khu vực -->
    <div class="mt-4 pt-3 border-t border-stone-100 flex flex-wrap items-center justify-between gap-2">
      <div class="text-xs font-bold text-stone-500">Lọc bàn cần in:</div>
      <div class="flex flex-wrap items-center gap-1.5">
        <button onclick="filterPrintArea('ALL')" id="filterBtn-ALL" class="print-filter-btn px-3 py-1.5 rounded-xl bg-stone-800 text-white text-xs font-bold shadow-xs">Tất cả (31 bàn)</button>
        <button onclick="filterPrintArea('Bàn Nhà Hàng')" id="filterBtn-Bàn Nhà Hàng" class="print-filter-btn px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-stone-600 text-xs font-bold hover:bg-stone-50">🍽️ Nhà Hàng (15 bàn)</button>
        <button onclick="filterPrintArea('Khu Hồ Bơi')" id="filterBtn-Khu Hồ Bơi" class="print-filter-btn px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-stone-600 text-xs font-bold hover:bg-stone-50">🏊 Hồ Bơi (12 bàn)</button>
        <button onclick="filterPrintArea('Sân Pickle')" id="filterBtn-Sân Pickle" class="print-filter-btn px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-stone-600 text-xs font-bold hover:bg-stone-50">🏓 Sân Pickle (4 bàn)</button>
      </div>
    </div>
  </header>

  <!-- Lưới hiển thị thẻ QR (Chuẩn tỷ lệ in 90mm x 100mm) -->
  <main class="max-w-5xl mx-auto w-full flex-1 flex justify-center">
    <div id="printCardsContainer" class="print-grid grid grid-cols-1 sm:grid-cols-2 gap-6 justify-items-center">
      <div class="col-span-full py-20 text-center text-stone-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-emerald-600"></i>
        <p class="text-xs font-semibold">Đang nạp danh sách bàn...</p>
      </div>
    </div>
  </main>

  <script>
    let allTables = [];
    let currentArea = 'ALL';

    async function loadTables() {
      try {
        const res = await fetch("/api/tables");
        allTables = await res.json();
        
        allTables.sort((a, b) => {
          const areaCompare = (a.area || '').localeCompare(b.area || '');
          if (areaCompare !== 0) return areaCompare;
          return (a.table_code || '').localeCompare(b.table_code || '');
        });

        const countPickle = allTables.filter(t => t.area === 'Sân Pickle').length;
        const countPool = allTables.filter(t => t.area === 'Khu Hồ Bơi').length;
        const countRestaurant = allTables.filter(t => t.area !== 'Sân Pickle' && t.area !== 'Khu Hồ Bơi').length;

        document.getElementById("totalBadge").innerText = `${allTables.length} bàn`;
        if (document.getElementById("filterBtn-ALL")) document.getElementById("filterBtn-ALL").innerText = `Tất cả (${allTables.length} bàn)`;
        if (document.getElementById("filterBtn-Bàn Nhà Hàng")) document.getElementById("filterBtn-Bàn Nhà Hàng").innerText = `🍽️ Nhà Hàng (${countRestaurant} bàn)`;
        if (document.getElementById("filterBtn-Khu Hồ Bơi")) document.getElementById("filterBtn-Khu Hồ Bơi").innerText = `🏊 Hồ Bơi (${countPool} bàn)`;
        if (document.getElementById("filterBtn-Sân Pickle")) document.getElementById("filterBtn-Sân Pickle").innerText = `🏓 Sân Pickle (${countPickle} bàn)`;

        renderCards();
      } catch (e) {
        console.error(e);
        document.getElementById("printCardsContainer").innerHTML = `
          <div class="col-span-full py-10 text-center text-rose-500 font-bold text-sm">
            Lỗi nạp dữ liệu bàn. Vui lòng tải lại trang.
          </div>
        `;
      }
    }

    function filterPrintArea(area) {
      currentArea = area;
      document.querySelectorAll(".print-filter-btn").forEach(b => {
        b.className = "print-filter-btn px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-stone-600 text-xs font-bold hover:bg-stone-50";
      });
      const target = document.getElementById(`filterBtn-${area}`);
      if (target) target.className = "print-filter-btn px-3 py-1.5 rounded-xl bg-stone-800 text-white text-xs font-bold shadow-xs";
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById("printCardsContainer");
      const origin = window.location.origin;

      const filtered = allTables.filter(t => {
        if (currentArea === 'ALL') return true;
        if (currentArea === 'Sân Pickle') return t.area === 'Sân Pickle';
        if (currentArea === 'Khu Hồ Bơi') return t.area === 'Khu Hồ Bơi';
        if (currentArea === 'Bàn Nhà Hàng') return (t.area !== 'Sân Pickle' && t.area !== 'Khu Hồ Bơi');
        return t.area === currentArea;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-stone-400 bg-white rounded-2xl border border-stone-200 w-full">
            <p class="text-xs font-semibold">Không có bàn nào trong khu vực đã chọn.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(t => {
        const qrUrl = `/api/tables/${t.table_code}/qr-image?base_url=${origin}`;
        return `
          <!-- Thẻ Bàn 9cm x 10cm Chuẩn In Ấn Xưởng Decal / Mica -->
          <div class="qr-card-9x10 shadow-xs hover:border-emerald-600 transition">
            
            <!-- 1. Header: Logo + PIPO GARDEN + Restaurant • Cafe • Pickleball + Tên Bàn -->
            <div class="w-full text-center flex flex-col items-center flex-shrink-0">
              <div class="flex items-center justify-center gap-1.5">
                <img src="/static/logo.png" alt="PiPo Garden" class="w-5 h-5 rounded-full object-contain">
                <span class="text-[12px] font-black tracking-widest text-emerald-950 uppercase leading-none">PIPO GARDEN</span>
              </div>
              <div class="text-[8px] font-bold text-emerald-700 tracking-wider uppercase mt-0.5 leading-tight">
                Restaurant • Cafe • Pickleball
              </div>
              <div class="text-[15px] font-black text-stone-900 tracking-tight mt-0.5 uppercase leading-none">
                ${t.name}
              </div>
            </div>

            <!-- 2. Khung Quét Mã Đặt Món Gọn Gàng Song Ngữ -->
            <div class="w-full bg-emerald-800 text-white py-1 px-1.5 rounded-lg text-center shadow-xs my-0.5 flex-shrink-0">
              <div class="text-[9.5px] font-black uppercase whitespace-nowrap flex items-center justify-center gap-1 leading-tight">
                <i class="fa-solid fa-qrcode text-amber-300 text-[9px]"></i>
                <span>QUÉT MÃ ĐẶT MÓN • SCAN TO ORDER</span>
              </div>
              <div class="text-[7px] font-bold text-emerald-200 tracking-wider uppercase leading-none mt-0.5 whitespace-nowrap">
                XEM THỰC ĐƠN & GỌI MÓN TRỰC TIẾP TẠI BÀN
              </div>
            </div>

            <!-- 3. Mã QR Trung Tâm Nét Căng To Tối Đa (58mm x 58mm) -->
            <div class="bg-white p-0.5 rounded-xl border border-stone-200 shadow-2xs my-0.5 flex items-center justify-center flex-shrink-0">
              <img src="${qrUrl}" alt="QR Code ${t.name}" style="width: 58mm; height: 58mm; object-fit: contain;">
            </div>

            <!-- 4. Footer: Wi-Fi To Đậm Rõ Ràng Cho Khách Nhìn Thấy Ngay -->
            <div class="w-full text-center pt-1 border-t border-stone-200 flex flex-col items-center flex-shrink-0">
              <div class="w-full bg-stone-100 py-1 px-2 rounded-lg border border-stone-200 text-stone-900 grid grid-cols-2 gap-1 items-center leading-tight">
                <div class="text-center border-r border-stone-200 pr-1">
                  <div class="text-[8.5px] font-bold text-stone-600 uppercase flex items-center justify-center gap-1">
                    <i class="fa-solid fa-wifi text-emerald-700 text-[8px]"></i> Wi-Fi
                  </div>
                  <div class="text-[11.5px] font-black text-emerald-950 whitespace-nowrap tracking-tight">PiPo - Garden</div>
                </div>
                <div class="text-center pl-1">
                  <div class="text-[8.5px] font-bold text-stone-600 uppercase flex items-center justify-center gap-1">
                    <i class="fa-solid fa-key text-emerald-700 text-[8px]"></i> Pass
                  </div>
                  <div class="text-[12px] font-black text-emerald-950 tracking-wider">88888888</div>
                </div>
              </div>
              <div class="text-[7px] text-stone-400 font-medium mt-0.5 leading-none whitespace-nowrap">
                Mở Camera hoặc Zalo để quét / Open Camera or Zalo to scan
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    document.addEventListener("DOMContentLoaded", loadTables);
  </script>
</body>
</html>
